services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: finance_tracker
      POSTGRES_PASSWORD: finance_tracker_password
      POSTGRES_DB: finance_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
